<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VORKA STORE - Recargas Cuba</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#0f0f1a;color:white;padding:15px;padding-bottom:40px}
header{text-align:center;padding:20px 0}
header h1{font-size:34px;color:#a855f7} header h1 span{color:#22c55e}
header p{color:#aaa;margin-top:6px;font-size:14px}
.badge{display:inline-block;background:#22c55e22;border:1px solid #22c55e;color:#22c55e;padding:4px 10px;border-radius:20px;font-size:12px;margin-top:10px}
.filtros{display:flex;gap:8px;overflow-x:auto;padding:12px 0}
.filtros button{background:#1e1e2e;color:white;border:1px solid #333;padding:9px 16px;border-radius:20px;white-space:nowrap;cursor:pointer}
.filtros button.active{background:#a855f7;border-color:#a855f7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}
.card{background:#1e1e2e;border-radius:14px;overflow:hidden;border:1px solid #333}
.card .img{height:95px;display:flex;align-items:center;justify-content:center;font-size:42px;background:#2a2a3a}
.card .info{padding:12px}
.card h3{font-size:15px}
.card .juego{font-size:12px;color:#a855f7;margin:3px 0}
.card .precio{font-size:19px;font-weight:bold;color:#22c55e;margin:8px 0}
.card button{width:100%;background:#22c55e;color:white;border:none;padding:11px;border-radius:8px;font-weight:bold;cursor:pointer}
.card button:active{transform:scale(.98)}
#estado{text-align:center;color:#888;padding:20px}
footer{text-align:center;color:#666;font-size:12px;margin-top:30px;line-height:1.6}
footer a{color:#22c55e;text-decoration:none}
</style>
</head>
<body>

<header>
<h1>VORKA<span> STORE</span></h1>
<p>Recargas rápidas en Cuba 🔥 | Transfermóvil • Zelle • USDT</p>
<div class="badge">● EN VIVO - Conectado a Supabase</div>
</header>

<div class="filtros" id="filtros">
<button class="active" onclick="filtrar('Todos',this)">Todos</button>
<button onclick="filtrar('Free Fire',this)">🔥 Free Fire</button>
<button onclick="filtrar('Roblox',this)">🧱 Roblox</button>
<button onclick="filtrar('PUBG',this)">🎯 PUBG</button>
</div>

<div id="estado">Cargando productos...</div>
<div class="grid" id="lista"></div>

<footer>
Vorka Store © 2026<br>
¿Dudas? <a href="https://wa.me/5350000000">Escríbenos por WhatsApp</a><br>
Cambia tu número buscando 5350000000 en el código
</footer>

<script>
const SUPABASE_URL = "https://hrluauvoefmkneopensn.supabase.co";
const SUPABASE_KEY = "sb_publishable_l9K4mAfh_uDEhvC8E3jjiw_Qu9FHMnk";
const MI_WA = "5350000000"; // <-- CAMBIA POR TU NUMERO REAL
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let productos = [];
let filtroActual = 'Todos';

function emojiPorJuego(juego){
  if(juego==='Free Fire') return '🔥';
  if(juego==='Roblox') return '🧱';
  if(juego==='PUBG') return '🎯';
  return '🎮';
}

async function cargar(){
  const { data, error } = await supabaseClient.from('productos').select('*').eq('activo', true).order('precio');
  if(error){
    document.getElementById('estado').innerHTML = 'Error: '+error.message;
    return;
  }
  productos = data;
  document.getElementById('estado').style.display='none';
  mostrar();
}

function mostrar(){
  const lista = document.getElementById('lista');
  lista.innerHTML = '';
  productos.filter(p => filtroActual==='Todos' || p.juego===filtroActual).forEach(p=>{
    lista.innerHTML += `
    <div class="card">
      <div class="img">${emojiPorJuego(p.juego)}</div>
      <div class="info">
        <h3>${p.nombre}</h3>
        <div class="juego">${p.juego}</div>
        <div class="precio">${p.precio} CUP</div>
        <button onclick="pedir(${p.id})">Pedir por WhatsApp</button>
      </div>
    </div>`;
  });
}

function filtrar(f,btn){
  filtroActual=f;
  document.querySelectorAll('.filtros button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  mostrar();
}

async function pedir(id){
  const p = productos.find(x=>x.id===id);
  // Guardar pedido en Supabase
  await supabaseClient.from('pedidos').insert([{ juego: p.juego, paquete: p.nombre, precio: p.precio, estado: 'pendiente', cliente: 'WhatsApp' }]);
  const msg = `Hola Vorka! Quiero pedir: ${p.juego} - ${p.nombre} - ${p.precio} CUP`;
  window.open(`https://wa.me/${MI_WA}?text=`+encodeURIComponent(msg), '_blank');
}

cargar();
</script>
</body>
</html>
